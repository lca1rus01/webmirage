[project]
name = "webmirage"
version = "0.1.0"
description = "MCP server that gives AI the ability to search and read the web. Starting with Twitter/X, extensible to more platforms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lca1rus01" }]
keywords = [
    "mcp", "ai-agent", "twitter", "web-search",
    "llm-tools", "model-context-protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mcp>=1.0",
    "curl_cffi>=0.7",
    "xclienttransaction>=1.0.1",
    "beautifulsoup4>=4.12",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
xueqiu = [
    "browser-cookie3>=0.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
webmirage = "webmirage.__main__:main"

[project.urls]
Homepage = "https://github.com/lca1rus01/webmirage"
Repository = "https://github.com/lca1rus01/webmirage"
Issues = "https://github.com/lca1rus01/webmirage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webmirage"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
